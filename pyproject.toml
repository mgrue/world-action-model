[project]
name = "toycar"
version = "0.1.0"
description = "Toy 2D overhead car simulator for a toy world action model (PLAN.md Step 1)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5,<2.6",
    "pygame-ce>=2.5.8,<2.6",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
